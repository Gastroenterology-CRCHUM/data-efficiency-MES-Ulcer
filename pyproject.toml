[build-system]
# >=77: SPDX `license` string + `license-files` (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-efficiency-mes-ulcer"
version = "0.1.0"
description = "Data efficiency learning curves for gastrointestinal ulcer detection and MES scoring"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# Runtime dependencies = third-party packages imported by src/ and scripts/
# (statsmodels: Holm correction in src/analysis/statistics.py).
# torch/torchvision: install the build matching your CUDA version from the
# PyTorch index first (see README, "Install"); pip then treats these
# floors as already satisfied. >=2.3 is required for torch.amp.GradScaler("cuda").
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0.29",  # DINOv2 / DINOv3 (tested version)
    "numpy>=1.24.4",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "opencv-python-headless>=4.8.0",
    "Pillow>=9.0.0",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Packages used only by notebooks/ (and `jupyter nbconvert --execute`).
notebooks = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "nbconvert>=7.0.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "scripts", "scripts.*"]
exclude = ["*.__pycache__", "*.__pycache__.*"]
# Defensive: also discover and install any subpackage that lacks an __init__.py.
namespaces = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
# Make `import src` / `import scripts` work without an editable install.
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--tb=short", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: requires a CUDA device",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long
    "B008",   # function call in default arg
    "B905",   # zip() strict=
    "SIM115", # context manager patterns
    "UP007",  # X | Y syntax
]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
